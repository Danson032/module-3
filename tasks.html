<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manage your tasks - Add, edit, and organize academic assignments"
    />
    <title>Student Task Manager - Tasks</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Navigation -->
      <nav class="navbar">
        <div class="nav-content">
          <div class="nav-brand">
            <h1>📚 Student Task Manager</h1>
          </div>
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Dashboard</a></li>
            <li><a href="tasks.html" class="nav-link active">Tasks</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
          </ul>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
          <h2>Task Management</h2>
          <p>Add, edit, and manage your academic tasks</p>
        </div>

        <!-- Add Task Section -->
        <section id="add-task-section" class="add-task-section">
          <h3>Add New Task</h3>
          <form id="task-form" class="task-form">
            <div class="form-row">
              <div class="form-group">
                <label for="task-title">Task Title *</label>
                <input
                  type="text"
                  id="task-title"
                  name="title"
                  placeholder="Enter task title"
                  required
                />
                <span class="error-message" id="error-title"></span>
              </div>

              <div class="form-group">
                <label for="task-course-code">Course Code *</label>
                <input
                  type="text"
                  id="task-course-code"
                  name="courseCode"
                  placeholder="e.g., CSE 310"
                  required
                />
                <span class="error-message" id="error-courseCode"></span>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="task-course-name">Course Name *</label>
                <input
                  type="text"
                  id="task-course-name"
                  name="courseName"
                  placeholder="e.g., Applied Programming"
                  required
                />
                <span class="error-message" id="error-courseName"></span>
              </div>

              <div class="form-group">
                <label for="task-priority">Priority *</label>
                <select id="task-priority" name="priority" required>
                  <option value="">Select Priority</option>
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
                <span class="error-message" id="error-priority"></span>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="task-category">Category *</label>
                <select id="task-category" name="category" required>
                  <option value="">Select Category</option>
                  <option value="assignment">Assignment</option>
                  <option value="project">Project</option>
                  <option value="exam">Exam</option>
                  <option value="quiz">Quiz</option>
                  <option value="reading">Reading</option>
                  <option value="other">Other</option>
                </select>
                <span class="error-message" id="error-category"></span>
              </div>

              <div class="form-group">
                <label for="task-due-date">Due Date *</label>
                <input type="date" id="task-due-date" name="dueDate" required />
                <span class="error-message" id="error-dueDate"></span>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group full-width">
                <label for="task-description">Description</label>
                <textarea
                  id="task-description"
                  name="description"
                  placeholder="Enter task description (optional)"
                  rows="4"
                ></textarea>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="task-study-time"
                  >Estimated Study Time (hours)</label
                >
                <input
                  type="number"
                  id="task-study-time"
                  name="studyTime"
                  placeholder="e.g., 2"
                  min="0"
                  step="0.5"
                />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Add Task</button>
              <button type="reset" class="btn btn-secondary">Clear Form</button>
            </div>

            <div id="form-message" class="message"></div>
          </form>
        </section>

        <!-- Search and Filter Section -->
        <section class="search-filter-section">
          <div class="search-box">
            <input
              type="text"
              id="search-input"
              placeholder="🔍 Search by title, course, or description..."
            />
          </div>

          <div class="filter-controls">
            <div class="filter-group">
              <label>Filter by:</label>
              <select id="filter-status">
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
                <option value="overdue">Overdue</option>
              </select>
            </div>

            <div class="filter-group">
              <label>Priority:</label>
              <select id="filter-priority">
                <option value="all">All Priorities</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>

            <div class="filter-group">
              <label>Category:</label>
              <select id="filter-category">
                <option value="all">All Categories</option>
                <option value="assignment">Assignment</option>
                <option value="project">Project</option>
                <option value="exam">Exam</option>
                <option value="quiz">Quiz</option>
                <option value="reading">Reading</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="filter-group">
              <label>Sort by:</label>
              <select id="sort-select">
                <option value="dueDate">Due Date</option>
                <option value="priority">Priority</option>
                <option value="course">Course</option>
                <option value="status">Status</option>
                <option value="dateAdded">Date Added</option>
              </select>
            </div>

            <button class="btn btn-secondary" id="reset-filters">
              Reset Filters
            </button>
          </div>
        </section>

        <!-- Tasks Display Section -->
        <section class="tasks-section">
          <div class="section-header">
            <h3>Your Tasks</h3>
            <span class="task-count" id="task-count">0 tasks</span>
          </div>

          <div id="tasks-container" class="tasks-container">
            <div class="empty-state">
              <div class="empty-icon">📝</div>
              <h3>No tasks yet</h3>
              <p>Add a task above to get started</p>
            </div>
          </div>
        </section>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <p>
          &copy; 2026 Student Task Manager | CSE 310 Applied Programming Module
          #3
        </p>
      </footer>
    </div>

    <!-- Edit Task Modal -->
    <div id="edit-modal" class="modal">
      <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h2>Edit Task</h2>
        <form id="edit-form" class="task-form">
          <input type="hidden" id="edit-task-id" />

          <div class="form-row">
            <div class="form-group">
              <label for="edit-task-title">Task Title *</label>
              <input type="text" id="edit-task-title" name="title" required />
            </div>

            <div class="form-group">
              <label for="edit-task-course-code">Course Code *</label>
              <input
                type="text"
                id="edit-task-course-code"
                name="courseCode"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="edit-task-course-name">Course Name *</label>
              <input
                type="text"
                id="edit-task-course-name"
                name="courseName"
                required
              />
            </div>

            <div class="form-group">
              <label for="edit-task-priority">Priority *</label>
              <select id="edit-task-priority" name="priority" required>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="edit-task-category">Category *</label>
              <select id="edit-task-category" name="category" required>
                <option value="assignment">Assignment</option>
                <option value="project">Project</option>
                <option value="exam">Exam</option>
                <option value="quiz">Quiz</option>
                <option value="reading">Reading</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="edit-task-due-date">Due Date *</label>
              <input
                type="date"
                id="edit-task-due-date"
                name="dueDate"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group full-width">
              <label for="edit-task-description">Description</label>
              <textarea
                id="edit-task-description"
                name="description"
                rows="4"
              ></textarea>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="edit-task-study-time"
                >Estimated Study Time (hours)</label
              >
              <input
                type="number"
                id="edit-task-study-time"
                name="studyTime"
                min="0"
                step="0.5"
              />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Task</button>
            <button type="button" class="btn btn-secondary" id="modal-cancel">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/tasks.js"></script>
  </body>
</html>
